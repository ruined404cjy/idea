<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" font-family="sans-serif" font-size="12">
  <style>
    .lbl   { fill:#455a64; font-size:12px; text-anchor:end; }
    .hdr   { fill:#ffffff; font-size:13px; font-weight:bold; text-anchor:middle; }
    .box   { text-anchor:middle; }
    .real  { fill:#e6f4ea; stroke:#34a853; }
    .neu   { fill:#e8f0fe; stroke:#4285f4; }
    .hb    { fill:#37474f; stroke:#37474f; }
    .t     { fill:#263238; text-anchor:middle; }
    .tr    { fill:#1e7e34; text-anchor:middle; }
    rect   { rx:6; }
    line.f { stroke:#90a4ae; stroke-width:1.5; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#90a4ae"/>
    </marker>
  </defs>

  <text x="20" y="26" font-size="15" font-weight="bold" fill="#263238">2×2 索引扫描：规划期发现 → scan_method 分发 → 执行器 → bridge</text>

  <!-- 行标签 -->
  <text class="lbl" x="92" y="62">查询</text>
  <text class="lbl" x="92" y="134">规划期发现</text>
  <text class="lbl" x="92" y="206">scan_method</text>
  <text class="lbl" x="92" y="278">执行器适配器</text>
  <text class="lbl" x="92" y="350">bridge 数据面</text>

  <!-- 表头 -->
  <rect class="hb" x="100" y="40" width="192" height="30"/>
  <text class="hdr" x="196" y="60">① 标量 × 全表</text>
  <rect class="hb" x="302" y="40" width="192" height="30"/>
  <text class="hdr" x="398" y="60">② 标量 × 索引</text>
  <rect class="hb" x="504" y="40" width="192" height="30"/>
  <text class="hdr" x="600" y="60">③ 向量 × 全表</text>
  <rect class="hb" x="706" y="40" width="192" height="30"/>
  <text class="hdr" x="802" y="60">④ 向量 × 索引</text>

  <!-- 行1 查询 -->
  <rect class="neu box" x="100" y="86" width="192" height="44"/>
  <text class="t" x="196" y="113">WHERE id &gt; 3</text>
  <rect class="neu box" x="302" y="86" width="192" height="44"/>
  <text class="t" x="398" y="106" font-size="11">WHERE id &gt; 3</text>
  <text class="t" x="398" y="122" font-size="11">带索引元数据</text>
  <rect class="neu box" x="504" y="86" width="192" height="44"/>
  <text class="t" x="600" y="106" font-size="11">ORDER BY &lt;-&gt; LIMIT k</text>
  <text class="t" x="600" y="122" font-size="11">未建索引元数据</text>
  <rect class="neu box" x="706" y="86" width="192" height="44"/>
  <text class="t" x="802" y="106" font-size="11">ORDER BY &lt;-&gt; LIMIT k</text>
  <text class="t" x="802" y="122" font-size="11">带索引元数据</text>

  <!-- 行2 发现 -->
  <rect class="real box" x="100" y="158" width="192" height="44"/>
  <text class="tr" x="196" y="180" font-size="11">真实</text>
  <text class="tr" x="196" y="195" font-size="11">谓词→sdk_filter</text>
  <rect class="real box" x="302" y="158" width="192" height="44"/>
  <text class="tr" x="398" y="180" font-size="11">真实</text>
  <text class="tr" x="398" y="195" font-size="11">谓词翻译 + 探测命中</text>
  <rect class="real box" x="504" y="158" width="192" height="44"/>
  <text class="tr" x="600" y="180" font-size="11">真实（PR#3）</text>
  <text class="tr" x="600" y="195" font-size="11">未命中→退回全表</text>
  <rect class="real box" x="706" y="158" width="192" height="44"/>
  <text class="tr" x="802" y="180" font-size="11">真实（PR#3）</text>
  <text class="tr" x="802" y="195" font-size="11">+ bridge 探测命中</text>

  <!-- 行3 scan_method -->
  <rect class="neu box" x="100" y="230" width="192" height="44"/>
  <text class="t" x="196" y="257">FULL</text>
  <rect class="neu box" x="302" y="230" width="192" height="44"/>
  <text class="t" x="398" y="257">SCALAR_INDEX</text>
  <rect class="neu box" x="504" y="230" width="192" height="44"/>
  <text class="t" x="600" y="251" font-size="11">FULL</text>
  <text class="t" x="600" y="266" font-size="11">+ 内核 VectorSearch</text>
  <rect class="neu box" x="706" y="230" width="192" height="44"/>
  <text class="t" x="802" y="251" font-size="11">VECTOR_INDEX</text>
  <text class="t" x="802" y="266" font-size="11">+ 内核 VectorSearch</text>

  <!-- 行4 执行器 -->
  <rect class="neu box" x="100" y="302" width="192" height="44"/>
  <text class="t" x="196" y="329" font-size="11">sdk_scan_adapter</text>
  <rect class="neu box" x="302" y="302" width="192" height="44"/>
  <text class="t" x="398" y="324" font-size="11">scalar_index_</text>
  <text class="t" x="398" y="338" font-size="11">scan_adapter</text>
  <rect class="neu box" x="504" y="302" width="192" height="44"/>
  <text class="t" x="600" y="329" font-size="11">sdk_scan_adapter</text>
  <rect class="neu box" x="706" y="302" width="192" height="44"/>
  <text class="t" x="802" y="329" font-size="11">index_scan_adapter</text>

  <!-- 行5 bridge -->
  <rect class="neu box" x="100" y="374" width="192" height="44"/>
  <text class="t" x="196" y="396" font-size="11">scan_open</text>
  <text class="t" x="196" y="410" font-size="11">+ filter_json</text>
  <rect class="neu box" x="302" y="374" width="192" height="44"/>
  <text class="t" x="398" y="396" font-size="11">search_scalar_</text>
  <text class="t" x="398" y="410" font-size="11">by_metadata</text>
  <rect class="neu box" x="504" y="374" width="192" height="44"/>
  <text class="t" x="600" y="400" font-size="11">scan_open</text>
  <rect class="neu box" x="706" y="374" width="192" height="44"/>
  <text class="t" x="802" y="396" font-size="11">search_vector_</text>
  <text class="t" x="802" y="410" font-size="11">by_metadata</text>

  <!-- 竖向箭头（每列 4 段） -->
  <g>
    <line class="f" x1="196" y1="130" x2="196" y2="156"/>
    <line class="f" x1="196" y1="202" x2="196" y2="228"/>
    <line class="f" x1="196" y1="274" x2="196" y2="300"/>
    <line class="f" x1="196" y1="346" x2="196" y2="372"/>
    <line class="f" x1="398" y1="130" x2="398" y2="156"/>
    <line class="f" x1="398" y1="202" x2="398" y2="228"/>
    <line class="f" x1="398" y1="274" x2="398" y2="300"/>
    <line class="f" x1="398" y1="346" x2="398" y2="372"/>
    <line class="f" x1="600" y1="130" x2="600" y2="156"/>
    <line class="f" x1="600" y1="202" x2="600" y2="228"/>
    <line class="f" x1="600" y1="274" x2="600" y2="300"/>
    <line class="f" x1="600" y1="346" x2="600" y2="372"/>
    <line class="f" x1="802" y1="130" x2="802" y2="156"/>
    <line class="f" x1="802" y1="202" x2="802" y2="228"/>
    <line class="f" x1="802" y1="274" x2="802" y2="300"/>
    <line class="f" x1="802" y1="346" x2="802" y2="372"/>
  </g>

  <!-- 图例 -->
  <rect class="real" x="100" y="438" width="16" height="14"/>
  <text x="122" y="450" fill="#455a64" font-size="11">真实发现</text>
  <rect class="neu" x="240" y="438" width="16" height="14"/>
  <text x="262" y="450" fill="#455a64" font-size="11">执行链路（scan_method / 执行器 / bridge）</text>
</svg>
