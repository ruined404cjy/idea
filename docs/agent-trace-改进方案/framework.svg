<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1080" width="1120" height="1080" color="#18384b" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Trace 数据支持 Agent 改进的框架</title>
  <desc id="diagram-desc">授权任务运行产生 Trace，经来源关联与用途质量检查，生成后训练样本、经验记忆和框架改进材料，分别更新模型参数、外部记忆和运行框架。独立评测与新任务执行的结果再次入库。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="currentColor" stroke-width="1.6"/></marker>
  </defs>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="currentColor">
    <text x="560" y="37" text-anchor="middle" font-size="25" font-weight="700">共同来源与血缘管理，按用途加工和验证</text>
    <rect x="275" y="65" width="570" height="86" rx="8" fill="currentColor" fill-opacity="0.035" stroke="currentColor" stroke-width="1.5"/>
    <text x="560" y="99" text-anchor="middle" font-size="21" font-weight="700">任务运行与人工反馈</text>
    <text x="560" y="128" text-anchor="middle" font-size="17">模型请求 · 工具交互 · 环境观测 · 测试与业务校验</text>
    <path d="M 560 151 V 196" fill="none" stroke="currentColor" stroke-width="1.7" marker-end="url(#arrow)"/>
    <text x="577" y="180" font-size="16">授权采集</text>
    <rect x="165" y="198" width="790" height="130" rx="8" fill="currentColor" fill-opacity="0.035" stroke="currentColor" stroke-width="1.5"/>
    <text x="560" y="234" text-anchor="middle" font-size="22" font-weight="700">Trace 数据管理与问题集</text>
    <text x="560" y="266" text-anchor="middle" font-size="17">请求快照／有序引用 · 结果证据 · 内容校验 · 环境与配置版本</text>
    <text x="560" y="296" text-anchor="middle" font-size="17">问题筛选 · 授权脱敏 · 去重隔离 · 用途准入 · 产物血缘</text>
    <path d="M 560 328 V 365 H 210 V 408 M 560 365 V 408 M 560 365 H 910 V 408" fill="none" stroke="currentColor" stroke-width="1.7" marker-end="url(#arrow)"/>
    <text x="225" y="395" text-anchor="start" font-size="16">按训练用途加工</text>
    <text x="575" y="395" text-anchor="start" font-size="16">按经验用途加工</text>
    <text x="925" y="395" text-anchor="start" font-size="16">按框架用途加工</text>
    <rect x="60" y="410" width="300" height="240" rx="8" fill="currentColor" fill-opacity="0.035" stroke="currentColor" stroke-width="1.5"/>
    <text x="210" y="448" text-anchor="middle" font-size="22" font-weight="700">后训练材料</text>
    <text x="210" y="487" text-anchor="middle" font-size="17">SFT：输入、目标与掩码</text>
    <text x="210" y="520" text-anchor="middle" font-size="17">DPO：可比候选与偏好依据</text>
    <text x="210" y="553" text-anchor="middle" font-size="17">PPO／GRPO：任务、环境、奖励</text>
    <text x="210" y="590" text-anchor="middle" font-size="16">按算法要求重新采样</text>
    <text x="210" y="619" text-anchor="middle" font-size="16">并记录策略版本</text>
    <rect x="410" y="410" width="300" height="240" rx="8" fill="currentColor" fill-opacity="0.035" stroke="currentColor" stroke-width="1.5"/>
    <text x="560" y="448" text-anchor="middle" font-size="22" font-weight="700">经验记忆</text>
    <text x="560" y="487" text-anchor="middle" font-size="17">问题、条件与操作方法</text>
    <text x="560" y="520" text-anchor="middle" font-size="17">验证方式与来源证据</text>
    <text x="560" y="553" text-anchor="middle" font-size="17">检索后提供给新任务</text>
    <text x="560" y="590" text-anchor="middle" font-size="16">执行结果驱动修订与停用</text>
    <rect x="760" y="410" width="300" height="240" rx="8" fill="currentColor" fill-opacity="0.035" stroke="currentColor" stroke-width="1.5"/>
    <text x="910" y="448" text-anchor="middle" font-size="22" font-weight="700">运行框架改进材料</text>
    <text x="910" y="487" text-anchor="middle" font-size="17">修改建议与回归样例</text>
    <text x="910" y="520" text-anchor="middle" font-size="17">提示词、工具与代码候选</text>
    <text x="910" y="553" text-anchor="middle" font-size="17">隔离环境执行与版本比较</text>
    <text x="910" y="590" text-anchor="middle" font-size="16">开发者／改进 Agent 实施</text>
    <path d="M 210 650 V 711 M 560 650 V 711 M 910 650 V 711" fill="none" stroke="currentColor" stroke-width="1.7" marker-end="url(#arrow)"/>
    <text x="225" y="690" text-anchor="start" font-size="16">训练系统消费</text>
    <text x="575" y="690" text-anchor="start" font-size="16">验证并发布</text>
    <text x="925" y="690" text-anchor="start" font-size="16">受控测试与筛选</text>
    <rect x="60" y="713" width="300" height="67" rx="8" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.5"/>
    <text x="210" y="754" text-anchor="middle" font-size="21" font-weight="700">更新模型参数</text>
    <rect x="410" y="713" width="300" height="67" rx="8" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.5"/>
    <text x="560" y="754" text-anchor="middle" font-size="21" font-weight="700">更新外部记忆</text>
    <rect x="760" y="713" width="300" height="67" rx="8" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.5"/>
    <text x="910" y="754" text-anchor="middle" font-size="21" font-weight="700">更新运行框架</text>
    <path d="M 210 780 V 815 H 560 M 910 780 V 815 H 560" fill="none" stroke="currentColor" stroke-width="1.7"/>
    <path d="M 560 780 V 854" fill="none" stroke="currentColor" stroke-width="1.7" marker-end="url(#arrow)"/>
    <text x="580" y="842" text-anchor="start" font-size="16">绑定产物与版本，分路线验证</text>
    <text x="575" y="801" text-anchor="start" font-size="16">推理时检索读取</text>
    <rect x="230" y="857" width="660" height="100" rx="8" fill="currentColor" fill-opacity="0.035" stroke="currentColor" stroke-width="1.5"/>
    <text x="560" y="895" text-anchor="middle" font-size="22" font-weight="700">独立评测与新任务运行</text>
    <text x="560" y="930" text-anchor="middle" font-size="17">正确率 · 人工复核工时 · 每个正确任务推理费用</text>
    <path d="M 890 907 H 1095 V 263 H 958" fill="none" stroke="currentColor" stroke-width="1.7" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
    <text x="1078" y="838" text-anchor="middle" font-size="17" transform="rotate(-90 1078 838)">新 Trace 与效果反馈入库</text>
    <text x="560" y="1006" text-anchor="middle" font-size="16">拟议架构；各路线共享来源管理，分别满足质量与评价要求。</text>
    <text x="560" y="1034" text-anchor="middle" font-size="15">SFT：监督微调；DPO：直接偏好优化</text>
    <text x="560" y="1060" text-anchor="middle" font-size="15">PPO：近端策略优化；GRPO：组相对策略优化</text>
  </g>
</svg>
