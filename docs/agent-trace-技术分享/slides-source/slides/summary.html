<div style="display:flex;flex-direction:column;gap:12px;background:#F5F4EF;border-radius:16px;padding:36px 40px">

<div style="display:flex;flex-direction:column;gap:12px;background:#F5F4EF;border-radius:16px;padding:36px 40px">

<p style="font-size:30px;line-height:1.5;color:#1B2530">步骤级定位明显难于 agent 级；利用执行依赖结构可以提高步骤级准确率</p>
